name: dispatch (move leads to city pipelines)

on:
  schedule:
    - cron: "*/2 * * * *"   # каждые 2 мин — фон для случаев когда сделка ещё не «Оплачено» но город не тот.
                            # Когда менеджер переводит в «Оплачено», страховка ВСЕГДА срабатывает
                            # внутри send-ticket workflow перед выпуском билета — поэтому 100% гарантия города.
  workflow_dispatch:        # ручной запуск из UI

concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run move_astana.py
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: python3 move_astana.py
