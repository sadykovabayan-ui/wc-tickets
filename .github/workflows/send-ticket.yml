name: send-ticket (dispatch + generate PDF + email)

on:
  schedule:
    - cron: "*/2 * * * *"   # каждые 2 минуты (репо публичный, лимитов CI нет)
  workflow_dispatch:

# Защита от параллельных запусков того же workflow
concurrency:
  group: send-ticket
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for PDF rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser fonts-liberation
      # ШАГ 1: страховка — раскидать сделки по городам (Алматы ↔ Астана).
      # Запускается ПЕРЕД выпуском билета, чтобы гость гарантированно получил
      # билет с правильным городом — даже если самостоятельный dispatch ещё не сработал.
      - name: Pre-dispatch (страховка городов перед выпуском билетов)
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: python3 move_astana.py
      # ШАГ 2: выпуск билетов для сделок в «Оплачено»
      - name: Run send_ticket.py
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WC_PROD_EMAIL: "1"
          WC_CHROME_BIN: /usr/bin/chromium-browser
        run: python3 send_ticket.py
      # ШАГ 3: health check — bounce detection + admin alerts.
      # Запускается ПОСЛЕ выпуска (чтобы успели зарегистрироваться bounces ранее
      # отправленных писем) — Resend обычно возвращает bounce за 30-60 сек.
      - name: Health check (bounces + hanging leads)
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 health_check.py
      # СТОРОЖ: в дни фестиваля (15.08, 22.08) проверяем что scanner-bot жив.
      # Если ни одного running/queued рана — поднимаем. Вторая линия защиты
      # после самоперезапуска (кейс 15.08: github.token не диспатчит workflow).
      - name: Watchdog scanner-bot
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          d=$(date -u +%m-%d)
          if [ "$d" = "08-15" ] || [ "$d" = "08-22" ]; then
            api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/scanner-bot.yml"
            n1=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$api/runs?status=in_progress&per_page=1" | python3 -c "import json,sys; print(json.load(sys.stdin).get('total_count',0))")
            n2=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$api/runs?status=queued&per_page=1" | python3 -c "import json,sys; print(json.load(sys.stdin).get('total_count',0))")
            if [ "$n1" = "0" ] && [ "$n2" = "0" ]; then
              curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/dispatches" -d '{"ref":"main"}'
              echo "⚠️ scanner-bot был мёртв — перезапущен сторожем"
            else
              echo "scanner-bot жив (running=$n1 queued=$n2)"
            fi
          fi
