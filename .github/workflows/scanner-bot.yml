name: scanner-bot (Telegram сканер билетов)

on:
  workflow_dispatch:      # ручной запуск (или запуск от предыдущей сессии)
  schedule:
    # Подстраховочные запуски в дни фестиваля (UTC = Алматы -5):
    # 15 августа Алматы и 22 августа Астана, старт 02:00 UTC = 07:00 Алматы
    - cron: "0 2 15 8 *"
    - cron: "0 2 22 8 *"

# Только один бот одновременно: новый запуск вытесняет старый
# (два long-polling инстанса конфликтуют за getUpdates)
concurrency:
  group: scanner-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # чуть меньше 6-часового лимита GitHub
    steps:
      - uses: actions/checkout@v4
      - name: Run bot (long polling ~5.7h)
        env:
          BOT_TOKEN: ${{ secrets.SCANNER_BOT_TOKEN }}
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
          ACCESS_CODE: ${{ secrets.SCANNER_ACCESS_CODE }}
          RUN_MINUTES: "340"
        run: python3 scanner_bot.py
      # Самоперезапуск: следующая сессия бота стартует сразу после этой
      - name: Re-dispatch next session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scanner-bot.yml/dispatches" \
            -d '{"ref":"main"}'
